name: mada_app
description: Application d'apprentissage de la langue Mada
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.6           # iOS-style icons
  google_fonts: ^6.1.0              # ACTIVE: Used for Poppins font in AppTheme
  animated_text_kit: ^4.2.2         # TODO: Use for typing effects in lessons
  flutter_animate: ^4.5.0           # ACTIVE: Used for page transitions and UI animations
  lottie: ^3.0.0                    # TODO: Use for loading states and success animations
  shimmer: ^3.0.0                   # TODO: Use for skeleton loading screens

  # State Management
  # TODO: Implement state management for user progress and word learning status
  # Choose ONE: provider (recommended for simplicity) OR get (for routing + state)
  provider: ^6.1.1                  # TODO: Use for user progress, settings, favorites
  get: ^4.6.6                       # Alternative: Routing + state management

  # Storage
  # TODO: Implement persistent storage for offline learning and progress tracking
  shared_preferences: ^2.2.2        # TODO: Store user preferences and settings
  sqflite: ^2.3.2                   # TODO: Local database for words, categories, progress
  path_provider: ^2.1.2             # TODO: Get app directories for file storage

  # Audio
  # TODO: Implement audio playback for word pronunciations
  # Choose ONE: audioplayers OR just_audio (just_audio is recommended)
  audioplayers: ^5.2.1              # Alternative audio player
  just_audio: ^0.9.36               # TODO: Play word pronunciation audio files

  # Network & Data
  # TODO: Implement API integration for cloud sync and updates
  dio: ^5.4.0                       # TODO: HTTP client for API calls
  cached_network_image: ^3.3.1     # TODO: Cache images from API/CDN

  # Utils
  intl: ^0.19.0                     # TODO: Use for date formatting and localization
  flutter_svg: ^2.0.9               # TODO: Use for scalable vector icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Note: We use google_fonts package for Poppins font (loaded dynamically).
  # If you prefer bundled fonts for offline use, add font files to assets/fonts/
  # and uncomment the configuration below:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
